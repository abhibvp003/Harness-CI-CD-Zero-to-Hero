# ============================================
# STORAGECLASS: Tells EKS Auto Mode how to provision EBS volumes
# EKS Auto Mode does NOT create a StorageClass automatically!!!!
# Same as Episode 6 — reuses auto-ebs-sc name
# ============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"
