# ============================================
# ENTERPRISE GITOPS PIPELINE (Episode 10 — MNC Production Way)
# ============================================
# Stage 1: CI — Build all microservice images + Push to ECR
# Stage 2: AI Security Agent — Analyze scan results
# Stage 3: AI Deployment Risk Agent — SAFE/RISKY/BLOCK
# Stage 4: GitOps Deploy — PR → Approve → Merge → Sync → Verify
# ============================================
pipeline:
  name: ep10-enterprise-gitops
  identifier: ep10_enterprise_gitops
  projectIdentifier: HarnessCICDZerotoHero
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>
  stages:
    # ============================================
    # STAGE 1: Build & Push to ECR (KubernetesDirect — MNC way)
    # Builds run on YOUR EKS cluster (code never leaves VPC)
    # ============================================
    - stage:
        name: security-scans
        identifier: security_scans
        description: "DevSecOps security scanning (Gitleaks, Trivy, OWASP, SonarQube)"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              - parallel:
                  - step:
                      type: Run
                      name: Gitleaks Scan
                      identifier: gitleaks
                      spec:
                        connectorRef: dockerhub
                        shell: Sh
                        image: zricethezav/gitleaks:latest
                        command: |-
                          gitleaks detect --source=/harness --no-git --report-format json --report-path /harness/gitleaks-report.json || true
                          echo "--- Gitleaks Report ---"
                          cat /harness/gitleaks-report.json
                          LEAKS=$(cat /harness/gitleaks-report.json | grep -c '"RuleID"' || echo "0")
                          if [ "$LEAKS" -gt 0 ]; then echo "FAILED: $LEAKS leaks found"; exit 1; fi

                  - step:
                      type: Run
                      name: Trivy Scan
                      identifier: trivy
                      spec:
                        connectorRef: dockerhub
                        shell: Sh
                        image: aquasec/trivy:latest
                        command: |-
                          trivy fs --severity HIGH,CRITICAL --format table --exit-code 0 /harness/Episode-10/src/

                  - step:
                      type: Run
                      name: OSV Dependency Scan
                      identifier: owasp
                      spec:
                        connectorRef: dockerhub
                        shell: Sh
                        image: alpine:3.19
                        command: |-
                          apk add --no-cache curl
                          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
                          chmod +x /usr/local/bin/osv-scanner
                          osv-scanner --recursive --format table /harness/Episode-10/src/
                          exit 0

                  - step:
                      type: Run
                      name: SonarQube Analysis
                      identifier: sonarqube
                      spec:
                        connectorRef: dockerhub
                        shell: Sh
                        image: sonarsource/sonar-scanner-cli:latest
                        envVariables:
                          SONAR_HOST_URL: <+variable.sonar_host_url>
                          SONAR_TOKEN: <+secrets.getValue("sonar_token")>
                          SONAR_USER_HOME: /tmp/.sonar
                        command: |-
                          echo "=== SonarQube Multi-Project Scan (11 microservices) ==="
                          SERVICES="frontend cartservice checkoutservice productcatalogservice currencyservice emailservice paymentservice recommendationservice shippingservice loadgenerator adservice"
                          FAILED=0
                          for SVC in $SERVICES; do
                            DIR="/harness/Episode-10/src/$SVC"
                            if [ -f "$DIR/sonar-project.properties" ]; then
                              echo "--- Scanning: $SVC ---"
                              sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectBaseDir="$DIR" -Dproject.settings="$DIR/sonar-project.properties" || FAILED=$((FAILED+1))
                            else
                              echo "--- SKIP: $SVC (no sonar-project.properties) ---"
                            fi
                          done
                          echo "=== SonarQube Complete: $FAILED failures ==="
                        resources:
                          limits:
                            memory: 3Gi

                  - step:
                      type: Run
                      name: Checkov IaC Scan
                      identifier: checkov
                      spec:
                        connectorRef: dockerhub
                        shell: Sh
                        image: bridgecrew/checkov:latest
                        command: |-
                          checkov --directory /harness/Episode-10/terraform --framework terraform --output cli --soft-fail
                          checkov --directory /harness/Episode-10/k8s --framework kubernetes --output cli --soft-fail

    # ============================================
    # STAGE 1b: Build & Push to ECR (separate stage — smaller pod fits on existing nodes)
    # ============================================
    - stage:
        name: build-and-push
        identifier: build_and_push
        description: "Build 11 microservice images and push to ECR"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              # Build and push all microservices (2 per batch — fits on t3a.xlarge 16GB)
              ###########################################################
              # 2 parallel × 4Gi = 8GB used → fits in 16GB node
              # If 3 parallel: 3 × 4Gi = 12GB → fits but tight (OS + kubelet + delegate also need RAM)
              # If 4 parallel: 4 × 4Gi = 16GB → OOMKilled, node has no RAM left for system processes ❌
              ################################################################
              # Restore cached build dependencies from S3 (Go modules, npm packages, Gradle deps)
              - step:
                  type: RestoreCacheS3
                  name: Restore Cache
                  identifier: restore_cache
                  spec:
                    connectorRef: account.aws_account
                    region: <+variable.aws_region>
                    bucket: <+variable.ci_cache_bucket>
                    key: ep10-build-cache
                    archiveFormat: Tar
                    failIfKeyNotFound: false
              # 2 builds run in parallel on t3a.xlarge (16GB). Memory limits prevent OOMKilled.
              # Batch 1: Frontend(4Gi) + CartService(4Gi) = 8GB at same time → finishes
              - parallel:
                  - step:
                      type: BuildAndPushECR
                      name: Push Frontend
                      identifier: push_frontend
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: frontend
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/frontend/Dockerfile
                        context: Episode-10/src/frontend
                        resources: # Memory limit prevents out-of-memory during parallel Docker builds
                          limits:
                            memory: 4Gi # 4 GB RAM limit for this build step

                  - step:
                      type: BuildAndPushECR
                      name: Push CartService
                      identifier: push_cartservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: cartservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/cartservice/src/Dockerfile
                        context: Episode-10/src/cartservice/src
                        resources: # .NET compilation needs more memory
                          limits:
                            memory: 4Gi # 4 GB RAM limit for this build step

                            # Batch 2: Checkout(3Gi) + ProductCatalog(3Gi) = 6GB at same time → finishes
              - parallel:
                  - step:
                      type: BuildAndPushECR
                      name: Push CheckoutService
                      identifier: push_checkoutservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: checkoutservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/checkoutservice/Dockerfile
                        context: Episode-10/src/checkoutservice
                        resources: # Go compilation memory limit
                          limits:
                            memory: 3Gi # 3 GB RAM limit for this build step

                  - step:
                      type: BuildAndPushECR
                      name: Push ProductCatalog
                      identifier: push_productcatalog
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: productcatalogservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/productcatalogservice/Dockerfile
                        context: Episode-10/src/productcatalogservice
                        resources: # Go compilation memory limit
                          limits:
                            memory: 3Gi # 3 GB RAM limit for this build step

              #Batch 3: Currency(2Gi) + Email(2Gi) = 4GB at same time → finishes
              - parallel:
                  - step:
                      type: BuildAndPushECR
                      name: Push CurrencyService
                      identifier: push_currencyservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: currencyservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/currencyservice/Dockerfile
                        context: Episode-10/src/currencyservice
                        resources: # Node.js build memory limit
                          limits:
                            memory: 2Gi # 2 GB RAM limit for this build step

                  - step:
                      type: BuildAndPushECR
                      name: Push EmailService
                      identifier: push_emailservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: emailservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/emailservice/Dockerfile
                        context: Episode-10/src/emailservice
                        resources: # Python build memory limit
                          limits:
                            memory: 2Gi # 2 GB RAM limit for this build step

                #Batch 4: Payment(2Gi) + Recommendation(2Gi) = 4GB at same time → finishesSS
              - parallel:
                  - step:
                      type: BuildAndPushECR
                      name: Push PaymentService
                      identifier: push_paymentservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: paymentservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/paymentservice/Dockerfile
                        context: Episode-10/src/paymentservice
                        resources: # 2Gi — Node.js npm install + small image, lightweight build
                          limits:
                            memory: 2Gi # 2 GB RAM limit for this build step

                  - step:
                      type: BuildAndPushECR
                      name: Push RecommendationService
                      identifier: push_recommendationservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: recommendationservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/recommendationservice/Dockerfile
                        context: Episode-10/src/recommendationservice
                        resources: # Python build memory limit
                          limits:
                            memory: 2Gi # 2 GB RAM limit for this build step

              #Batch 5: Shipping(3Gi) + AdService(4Gi) = 7GB at same time → finishes
              - parallel:
                  - step:
                      type: BuildAndPushECR
                      name: Push ShippingService
                      identifier: push_shippingservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: shippingservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/shippingservice/Dockerfile
                        context: Episode-10/src/shippingservice
                        resources: # Go compilation memory limit
                          limits:
                            memory: 3Gi # 3 GB RAM limit for this build step

                  - step:
                      type: BuildAndPushECR
                      name: Push AdService
                      identifier: push_adservice
                      spec:
                        connectorRef: account.aws_account
                        region: <+variable.aws_region>
                        account: <+variable.aws_account_id>
                        imageName: adservice
                        tags:
                          - v<+pipeline.sequenceId>
                        dockerfile: Episode-10/src/adservice/Dockerfile
                        context: Episode-10/src/adservice
                        resources: # Java/Gradle compilation needs more memory
                          limits:
                            memory: 4Gi # 4 GB RAM limit for this build step

              #Batch 6: LoadGenerator(2Gi) = 2GB alone → finishes
              - step:
                  type: BuildAndPushECR
                  name: Push LoadGenerator
                  identifier: push_loadgenerator
                  spec:
                    connectorRef: account.aws_account
                    region: <+variable.aws_region>
                    account: <+variable.aws_account_id>
                    imageName: loadgenerator
                    tags:
                      - v<+pipeline.sequenceId>
                    dockerfile: Episode-10/src/loadgenerator/Dockerfile
                    context: Episode-10/src/loadgenerator
                    resources: # Python build memory limit
                      limits:
                        memory: 2Gi # 2 GB RAM limit for this build step

              # Save build dependencies to S3 cache (next pipeline run will be faster)
              - step:
                  type: Run
                  name: Prepare Cache Dirs
                  identifier: prepare_cache
                  spec:
                    shell: Sh
                    image: alpine:3.19
                    command: |-
                      mkdir -p /root/.cache/go-build /root/go/pkg/mod /root/.npm /root/.gradle/caches
              - step:
                  type: SaveCacheS3
                  name: Save Cache
                  identifier: save_cache
                  spec:
                    connectorRef: account.aws_account
                    region: <+variable.aws_region>
                    bucket: <+variable.ci_cache_bucket>
                    key: ep10-build-cache
                    sourcePaths:
                      - /root/.cache/go-build
                      - /root/go/pkg/mod
                      - /root/.npm
                      - /root/.gradle/caches
                    archiveFormat: Tar

    # ============================================
    # STAGE 1c: Post-Build Image Security Scan (Trivy scans final Docker images for OS/runtime CVEs)
    # Pre-build scans source code, post-build scans the actual container that runs in production
    # ============================================
    - stage:
        name: image-security-scan
        identifier: image_security_scan
        description: "Trivy scans all 11 built ECR images for container vulnerabilities (OS packages, runtime CVEs)"
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              # Scans all 11 ECR images using aws ecr get-login-password (OIDC connector, no access keys)
              - step:
                  type: Run
                  name: Trivy Scan All ECR Images
                  identifier: trivy_scan_all_images
                  spec:
                    connectorRef: account.aws_account
                    shell: Sh
                    image: amazon/aws-cli:latest
                    envVariables:
                      AWS_DEFAULT_REGION: <+variable.aws_region>
                    command: |-
                      # Install Trivy
                      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

                      # Get ECR credentials using OIDC connector (no access keys — IAM role assumed automatically)
                      ECR_REGISTRY="<+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com"
                      export TRIVY_USERNAME=AWS
                      export TRIVY_PASSWORD=$(aws ecr get-login-password --region <+variable.aws_region>)

                      # All 11 microservice image names
                      SERVICES="frontend cartservice checkoutservice productcatalogservice currencyservice emailservice paymentservice recommendationservice shippingservice adservice loadgenerator"
                      TAG="v<+pipeline.sequenceId>"

                      echo "============================================"
                      echo "  TRIVY IMAGE SCAN — 11 Microservices"
                      echo "  Registry: ${ECR_REGISTRY}"
                      echo "  Tag: ${TAG}"
                      echo "============================================"

                      for SVC in $SERVICES; do
                        echo ""
                        echo "--- Scanning: ${SVC}:${TAG} ---"
                        trivy image --severity HIGH,CRITICAL --no-progress --exit-code 0 \
                          "${ECR_REGISTRY}/${SVC}:${TAG}"
                        echo "--- ${SVC} scan complete ---"
                      done

                      echo ""
                      echo "============================================"
                      echo "  ALL 11 IMAGE SCANS COMPLETE"
                      echo "============================================"

    # ============================================
    # STAGE 2: AI Security Agent
    # ============================================
    - stage:
        name: ai-security-analysis
        identifier: ai_security_analysis
        description: "AI agent analyzes security scan results"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              - step:
                  type: Run
                  name: AI Security Agent
                  identifier: ai_security_agent
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: python:3.11-slim
                    envVariables:
                      OPENAI_API_KEY: <+secrets.getValue("openai_api_key")>
                    command: |-
                      cd Episode-10/ai-agents
                      python security_agent.py \
                        --trivy /harness/trivy-results.json \
                        --gitleaks /harness/gitleaks-report.json \
                        --npm-audit /harness/npm-audit.json 2>/dev/null || true

    # ============================================
    # STAGE 3: AI Deployment Risk Agent
    # ============================================
    - stage:
        name: ai-deployment-risk
        identifier: ai_deployment_risk
        description: "AI agent assesses if deployment is safe"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              - step:
                  type: Run
                  name: AI Deployment Risk Agent
                  identifier: ai_risk_agent
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: python:3.11-slim
                    envVariables:
                      OPENAI_API_KEY: <+secrets.getValue("openai_api_key")>
                    command: |-
                      cd Episode-10/ai-agents
                      python deployment_risk_agent.py \
                        --environment production \
                        --test-status passed \
                        --security-status passed \
                        --changes 10 \
                        --trivy-critical 0 \
                        --secrets-found 0 || true

    # ============================================
    # STAGE 4: GitOps Deploy (PR → Approve → Merge → Sync → Verify)
    # This is the MNC production deployment pattern
    # ============================================
    - stage:
        name: gitops-deploy
        identifier: gitops_deploy
        description: "GitOps PR pipeline — update Git, ArgoCD syncs cluster"
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: online_boutique
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: ecr_frontend
                          type: Ecr
                          spec:
                            tag: v<+pipeline.sequenceId>
          environment:
            environmentRef: production
            deployToAll: false
            gitOpsClusters:
              - identifier: incluster
                agentIdentifier: ep10gitopsagent
          execution:
            steps:
              # Step 1: Update ALL image tags in values.yaml via PR
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: update_release_repo
                  timeout: 10m
                  spec:
                    variables:
                      - name: frontendImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/frontend:v<+pipeline.sequenceId>
                      - name: cartserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/cartservice:v<+pipeline.sequenceId>
                      - name: checkoutserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/checkoutservice:v<+pipeline.sequenceId>
                      - name: productcatalogserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/productcatalogservice:v<+pipeline.sequenceId>
                      - name: currencyserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/currencyservice:v<+pipeline.sequenceId>
                      - name: emailserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/emailservice:v<+pipeline.sequenceId>
                      - name: paymentserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/paymentservice:v<+pipeline.sequenceId>
                      - name: recommendationserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/recommendationservice:v<+pipeline.sequenceId>
                      - name: shippingserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/shippingservice:v<+pipeline.sequenceId>
                      - name: adserviceImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/adservice:v<+pipeline.sequenceId>
                      - name: loadgeneratorImage
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/loadgenerator:v<+pipeline.sequenceId>
                    prTitle: "Deploy Online Boutique build #<+pipeline.sequenceId>"

              # Step 2: Human approval before merge to production
              - step:
                  type: HarnessApproval
                  name: Approve Deployment
                  identifier: approve_deployment
                  timeout: 1d
                  spec:
                    approvalMessage: "Approve deployment of build #<+pipeline.sequenceId> to production (10 microservices)"
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false

              # Step 3: Merge PR into main (ArgoCD watches main branch)
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: merge_pr
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true

              # Step 4: Trigger immediate ArgoCD sync (don't wait 3-min poll)
              - step:
                  type: GitOpsSync
                  name: Sync Application
                  identifier: gitops_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList:
                      - applicationName: online-boutique
                        agentId: ep10gitopsagent
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground

              # Step 5: Check application health status
              - step:
                  type: GitOpsGetAppDetails
                  name: Get App Status
                  identifier: get_app_status
                  timeout: 5m
                  spec:
                    applicationsList:
                      - applicationName: online-boutique
                        agentId: ep10gitopsagent

              # Step 6: Continuous Verification (Episode 9 — auto-rollback if metrics degrade)
              # Compares pre/post deployment metrics from Prometheus
              # If error_rate or latency increase → triggers rollback automatically
              - step:
                  type: Verify
                  name: Verify Deployment
                  identifier: verify_deployment
                  timeout: 15m
                  spec:
                    isMultiServicesOrEnvs: false
                    type: Rolling
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: MEDIUM
                      duration: 5m
                      deploymentTag: <+pipeline.sequenceId>

            # ============================================
            # ROLLBACK (auto-triggered on failure)
            # Reverts Git commit → ArgoCD syncs old version
            # ============================================
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: revert_pr
                  timeout: 10m
                  spec:
                    commitId: <+pipeline.stages.gitops_deploy.spec.execution.steps.update_release_repo.updateReleaseRepoOutcome.commitId>

              - step:
                  type: MergePR
                  name: Merge Revert PR
                  identifier: merge_revert_pr
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true

              - step:
                  type: GitOpsSync
                  name: Rollback Sync
                  identifier: rollback_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList:
                      - applicationName: online-boutique
                        agentId: ep10gitopsagent
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        gitOpsEnabled: true

    # ============================================
    # STAGE 6: OWASP ZAP — Dynamic Application Security Testing (DAST)
    # Scans the LIVE deployed application for web vulnerabilities (XSS, SQL injection, etc.)
    # Runs AFTER deployment because DAST needs a running application to test against
    # ============================================
    - stage:
        name: dast-owasp-zap
        identifier: dast_owasp_zap
        description: "OWASP ZAP baseline scan against live application URL"
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector:
                purpose: ci-builds
              tolerations:
                - key: dedicated
                  value: ci-builds
                  effect: NoSchedule
          execution:
            steps:
              # OWASP ZAP baseline scan — spiders the app for 1 minute, then passive scans all responses
              - step:
                  type: Run
                  name: OWASP ZAP Baseline Scan
                  identifier: owasp_zap_scan
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: ghcr.io/zaproxy/zaproxy:stable
                    command: |-
                      echo "============================================"
                      echo "  OWASP ZAP — Dynamic Application Security Test"
                      echo "  Target: https://app.<+variable.domain_name>"
                      echo "============================================"
                      zap-baseline.py -t https://app.<+variable.domain_name> -r /harness/zap-report.html -I
                      echo ""
                      echo "============================================"
                      echo "  ZAP BASELINE SCAN COMPLETE"
                      echo "  Report: /harness/zap-report.html"
                      echo "============================================"

  # Slack notification on success/failure
  notificationRules:
    - name: Pipeline Notifications
      enabled: true
      pipelineEvents:
        - type: PipelineSuccess
        - type: PipelineFailed
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+secrets.getValue("slack_webhook_url")>
