# ═══════════════════════════════════════════════════════════════════
# Elasticsearch 7.17 — Helm values for EFK logging stack
# Uses basic auth (user/password) without mandatory HTTPS
# ═══════════════════════════════════════════════════════════════════

replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

volumeClaimTemplate:
  resources:
    requests:
      storage: "10Gi"
  storageClassName: "auto-ebs-sc"

# X-Pack security — password auth enabled, no SSL required in 7.x
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: true
    xpack.security.transport.ssl.enabled: false

# Bootstrap password for elastic user
extraEnvs:
  - name: ELASTIC_PASSWORD
    value: "${ELASTIC_PASSWORD}"
  - name: xpack.security.enabled
    value: "true"
