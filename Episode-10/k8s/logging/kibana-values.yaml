# ═══════════════════════════════════════════════════════════════════
# Kibana 7.17 — Helm values for log visualization
# Connects to ES 7.x via HTTP with basic auth (no SSL required)
# ═══════════════════════════════════════════════════════════════════

elasticsearchHosts: "http://elasticsearch-master:9200"

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

# Basic auth credentials for ES
extraEnvs:
  - name: ELASTICSEARCH_USERNAME
    value: "elastic"
  - name: ELASTICSEARCH_PASSWORD
    value: "${ELASTIC_PASSWORD}"

# Kong Ingress
ingress:
  enabled: true
  className: "kong"
  hosts:
    - host: "kibana.${DOMAIN_NAME}"
      paths:
        - path: /
