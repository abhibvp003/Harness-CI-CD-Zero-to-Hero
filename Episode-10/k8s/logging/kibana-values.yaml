# ═══════════════════════════════════════════════════════════════════
# Kibana 8.5.1 — Helm values for log visualization
# Connects to Elasticsearch via HTTP (SSL disabled) with X-Pack credentials
# Exposed via Kong Ingress at kibana.<domain>
# ═══════════════════════════════════════════════════════════════════

# Elasticsearch connection — HTTP (not HTTPS since we disabled ES HTTP SSL)
elasticsearchHosts: "http://elasticsearch-master:9200"

# Resource limits
resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

# Credentials for X-Pack auth (injected by Terraform via helm.parameters)
extraEnvs:
  - name: ELASTICSEARCH_USERNAME
    value: "elastic"
  - name: ELASTICSEARCH_PASSWORD
    value: "${ELASTIC_PASSWORD}"
  - name: SERVER_BASEPATH
    value: ""

# Kong Ingress — accessible at kibana.<domain>
ingress:
  enabled: true
  className: "kong"
  hosts:
    - host: "kibana.${DOMAIN_NAME}"
      paths:
        - path: /

# Readiness probe tuning — give Kibana time to connect to ES
readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 10
