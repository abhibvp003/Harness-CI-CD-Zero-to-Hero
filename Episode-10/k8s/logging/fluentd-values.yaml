# ═══════════════════════════════════════════════════════════════════
# Fluentd 0.5.2 — Helm values for log collection (DaemonSet)
# Uses fluentd-kubernetes-daemonset image with ES8 plugin pre-installed
# Collects all pod logs → ships to Elasticsearch with buffering
# ═══════════════════════════════════════════════════════════════════

# DaemonSet mode — runs on every node, collects all pod logs
kind: DaemonSet

# Image with Elasticsearch 8 output plugin pre-installed
image:
  repository: fluent/fluentd-kubernetes-daemonset
  tag: v1.16-debian-elasticsearch8-1

# Env vars for ES connection (referenced in output.conf via Ruby interpolation)
env:
  - name: FLUENT_ELASTICSEARCH_HOST
    value: "elasticsearch-master.logging.svc.cluster.local"
  - name: FLUENT_ELASTICSEARCH_PORT
    value: "9200"
  - name: FLUENT_ELASTICSEARCH_USER
    value: "elastic"
  - name: FLUENT_ELASTICSEARCH_PASSWORD
    value: "${ELASTIC_PASSWORD}"
  - name: FLUENT_ELASTICSEARCH_SCHEME
    value: "http"
  - name: FLUENT_ELASTICSEARCH_SSL_VERIFY
    value: "false"

# Fluentd output config — send all collected logs to Elasticsearch
fileConfigs:
  output.conf: |
    <match **>
      @type elasticsearch
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      user "#{ENV['FLUENT_ELASTICSEARCH_USER']}"
      password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD']}"
      scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME']}"
      ssl_verify false
      logstash_format true
      logstash_prefix k8s-logs
      reconnect_on_error true
      reload_on_failure true
      reload_connections false
      request_timeout 15s
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        flush_interval 5s
        retry_type exponential_backoff
        retry_max_interval 30s
        chunk_limit_size 2M
        queue_limit_length 8
        overflow_action block
      </buffer>
    </match>
