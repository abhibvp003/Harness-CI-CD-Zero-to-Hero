# ═══════════════════════════════════════════════════════════════════
# ExternalSecret — Pulls DB credentials from AWS Secrets Manager
# Terraform creates RDS → stores credentials in AWS SM automatically
# ESO pulls them → creates K8s Secret "db-credentials"
# Pods use: envFrom: secretRef: db-credentials
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{.Values.namespace}}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: online-boutique/db-credentials
