apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: {{.Values.namespace}}
  labels:
    app: emailservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
        - name: emailservice
          image: {{.Values.emailserviceImage}}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: {{.Values.namespace}}
spec:
  type: ClusterIP
  selector:
    app: emailservice
  ports:
    - port: 8080
      targetPort: 8080
