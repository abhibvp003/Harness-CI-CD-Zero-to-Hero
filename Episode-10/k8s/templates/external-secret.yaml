# ═══════════════════════════════════════════════════════════════════
# ExternalSecret — Pulls secrets from AWS Secrets Manager
# ESO reads from AWS SM → creates K8s Secret "app-secrets"
# Pods reference this secret via envFrom or valueFrom
# Refresh interval: 1h (auto-rotation)
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{.Values.namespace}}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: online-boutique/app-secrets
