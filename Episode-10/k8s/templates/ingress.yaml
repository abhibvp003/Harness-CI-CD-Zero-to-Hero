# ═══════════════════════════════════════════════════════════════════
# Ingress — Kong Gateway routes traffic to frontend
# Kong auto-creates 1 NLB (cheaper than ALB) with ACM certificate
# Kong adds: rate limiting, logging, metrics on all traffic automatically
# ═══════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-boutique-ingress
  namespace: {{.Values.namespace}}
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: "app.{{.Values.domain}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
