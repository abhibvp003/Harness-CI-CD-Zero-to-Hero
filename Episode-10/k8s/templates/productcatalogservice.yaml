apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: {{.Values.namespace}}
  labels:
    app: productcatalogservice
spec:
  replicas: {{int .Values.replicas}}
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      containers:
        - name: productcatalogservice
          image: {{.Values.productcatalogserviceImage}}
          ports:
            - containerPort: 3550
          env:
            - name: PORT
              value: "3550"
            - name: ENABLE_TRACING
              value: "{{.Values.enableTracing}}"
            - name: COLLECTOR_SERVICE_ADDR
              value: "{{.Values.collectorServiceAddr}}"
          envFrom:
            - secretRef:
                name: db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: {{.Values.namespace}}
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
    - port: 3550
      targetPort: 3550
