# ═══════════════════════════════════════════════════════════════════
# OpenTelemetry Collector — Helm values
# Chart: open-telemetry/opentelemetry-collector
# Receives traces/metrics from microservices → exports to Jaeger + Prometheus
# Microservices send to: otel-collector.tracing:4317 (gRPC OTLP)
# ═══════════════════════════════════════════════════════════════════

# Deploy as a single-replica Deployment (not DaemonSet)
mode: deployment

# Use contrib image (has all exporters/receivers/processors)
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.104.0"

# Resource limits — sized for demo workload
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Ports exposed by the collector service
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# Prometheus scrape annotations on collector pod
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"

# OTel Collector pipeline configuration
config:
  # Health check extension — required for readiness/liveness probes
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  # Receivers — accept OTLP traces/metrics from microservices
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # Processors — batch + memory limiter for production stability
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128

  # Exporters — Jaeger (traces) + Prometheus (metrics)
  exporters:
    # Send traces to Jaeger v2 via OTLP gRPC (service name = helm release name)
    otlp/jaeger:
      endpoint: jaeger.tracing.svc.cluster.local:4317
      tls:
        insecure: true
    # Expose span metrics for Prometheus scraping
    prometheus:
      endpoint: 0.0.0.0:8889
      namespace: otel

  # Service — wire receivers → processors → exporters
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/jaeger
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus
