sonar.projectKey=online-boutique
sonar.projectName=Online Boutique (Enterprise Capstone)
sonar.projectVersion=1.0.0

# Source directories (all microservices)
sonar.sources=src/frontend,src/cartservice/src,src/checkoutservice,src/currencyservice,src/emailservice,src/paymentservice,src/productcatalogservice,src/recommendationservice,src/shippingservice,src/adservice,src/loadgenerator

# Exclude generated protobuf files and vendor directories
sonar.exclusions=**/genproto/**,**/proto/**,**/vendor/**,**/node_modules/**,**/*.pb.go,**/gradle/**

# Language-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
sonar.working.directory=/tmp/.scannerwork
